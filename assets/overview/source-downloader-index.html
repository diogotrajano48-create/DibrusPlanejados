<script>/* Website Downloader 3.0 — modo arquivo (.html único, SPEC §6.1).
 *
 * Aberto via file://, o navegador não deixa rodar Service Worker, bloqueia fetch/XHR, fontes e módulos, e
 * resolve caminhos como /assets/x.png para a raiz do disco. Este script faz dentro da própria página o papel do

 * scripts clássicos que o navegador só pediu em no-cors). O que não foi gravado vai para a URL original (online) e
